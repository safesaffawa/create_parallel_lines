modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Create is a hard prerequisite: the game refuses to start if it is missing or older than 6.0.10.
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[${create_version_range},6.1.0)"
    ordering="AFTER"
    side="BOTH"
