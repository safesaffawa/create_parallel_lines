# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---------------------------------------------------------------------------
# Minecraft / NeoForge
# https://projects.neoforged.net/neoforged/neoforge
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neo_version=21.1.265
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# ---------------------------------------------------------------------------
# Parchment parameter names / javadoc
# https://parchmentmc.org/docs/getting-started
# ---------------------------------------------------------------------------
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ---------------------------------------------------------------------------
# Create addon dependencies
# https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
# create_version is the CI build number that matches the Create 6.0.10 release jar.
# ---------------------------------------------------------------------------
create_version=6.0.10-280
# Lower bound used in the neoforge.mods.toml dependency range (the released Create version).
create_version_range=6.0.10
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# ---------------------------------------------------------------------------
# Mod metadata
# ---------------------------------------------------------------------------
# Unique, lowercase, matching [a-z][a-z0-9_]{1,63}; must equal the MODID constant in the mod class.
mod_id=create_parallel_lines
mod_name=Create: Parallel Lines
mod_license=MIT
mod_version=0.1.0
# Base package of the sources; also the Maven group id when publishing.
mod_group_id=com.safesaffawa.create_parallel_lines
mod_authors=SourceNa2CO3Zn
mod_description=An addon that adds parallel production lines to Create.
